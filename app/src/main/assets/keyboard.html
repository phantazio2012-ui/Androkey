<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Clavier Plein Écran</title>
<style>
:root{--bg:#06265f;--bg2:#1457c8;--k1:#2f6fe0;--k2:#1b4fb5;--kd:#0f3278;--f1:#173f8f;--f2:#0f2f70;--txt:#fff;--accent:#ffb300;--bar:rgba(255,255,255,.10);--bd:rgba(255,255,255,.18);--pan:#0a2f72}
[data-theme=sombre]{--bg:#0a0a0c;--bg2:#2a2a33;--k1:#3a3a44;--k2:#26262d;--kd:#101014;--f1:#1c1c22;--f2:#121216;--txt:#eee;--accent:#00e0c0;--pan:#17171c}
[data-theme=vert]{--bg:#063a1d;--bg2:#17894a;--k1:#2aa860;--k2:#1b8648;--kd:#0c4c28;--f1:#146b38;--f2:#0d5028;--accent:#ffd54f;--pan:#0a4423}
[data-theme=rose]{--bg:#4a0d2f;--bg2:#c2397f;--k1:#dc4f96;--k2:#b02f74;--kd:#6d1646;--f1:#8e2560;--f2:#6c1a49;--accent:#ffe082;--pan:#5e1239}
[data-theme=clair]{--bg:#cfd5e4;--bg2:#f4f6fb;--k1:#fff;--k2:#e6e9f2;--kd:#b3b9cb;--f1:#d5daea;--f2:#c3c9db;--txt:#1a1a1a;--accent:#1e5fd1;--bar:rgba(0,0,0,.07);--bd:rgba(0,0,0,.12);--pan:#e9ecf5}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  background:radial-gradient(120% 90% at 15% 0%,var(--bg2) 0%,var(--bg) 62%) fixed}
#app{display:flex;flex-direction:column;height:100dvh;padding:10px;gap:10px}
#bar{position:relative;display:flex;gap:10px;align-items:center;background:var(--bar);border:1px solid var(--bd);border-radius:16px;padding:8px 10px 8px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#bar .sp{flex:1}
button.t,select{background:var(--bar);color:var(--txt);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;font-family:inherit}
button.t:active{filter:brightness(1.25)}
#set{font-size:22px;line-height:1;padding:8px 13px}
#btn{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:#111;border:0;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#bt{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}
#btx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot{width:12px;height:12px;border-radius:50%;background:#e53935;box-shadow:0 0 0 4px rgba(229,57,53,.25);flex:none}
#bt.on #dot{background:#43d17a;box-shadow:0 0 0 4px rgba(67,209,122,.28),0 0 12px #43d17a}
#panel{position:absolute;right:0;top:calc(100% + 8px);z-index:10;width:min(460px,100%);background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:7px}
.f>label,.f>.l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.inl{display:flex;gap:8px;flex-wrap:wrap}
.inl select{flex:1;min-width:0}
select option{color:#111}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sw button.sel{border-color:var(--accent);transform:scale(1.1)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
#out{background:var(--bar);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;min-height:56px;max-height:22vh;overflow:auto;white-space:pre-wrap;font-size:18px}
#kb{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.row{flex:1;display:flex;gap:8px;min-height:0}
.k{flex:1;min-width:0;color:var(--txt);border:1px solid var(--bd);border-radius:14px;padding:0;
  font-size:clamp(18px,3.8vmin,36px);font-weight:600;font-family:inherit;
  background:linear-gradient(180deg,var(--k1),var(--k2));
  box-shadow:0 4px 0 var(--kd),0 10px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .05s,box-shadow .05s,filter .05s;touch-action:manipulation;text-shadow:0 1px 1px rgba(0,0,0,.25)}
[data-theme=clair] .k{text-shadow:none}
.k:active{transform:translateY(3px);box-shadow:0 1px 0 var(--kd),0 0 18px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.18)}
.k.w15{flex:1.5}.k.w5{flex:5;font-size:clamp(14px,2.6vmin,22px);letter-spacing:.18em;text-transform:uppercase;opacity:.95}
.k.fn{background:linear-gradient(180deg,var(--f1),var(--f2))}
.k.act{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:#111;text-shadow:none;box-shadow:0 4px 0 var(--kd),0 0 20px color-mix(in srgb,var(--accent) 60%,transparent)}
</style>
</head>
<body data-theme="bleu">
<div id="app">
  <div id="bar">
    <div id="bt"><span id="dot"></span><span id="btx">Bluetooth : non connecté</span></div>
    <div class="sp"></div>
    <button class="t" id="btn">Connecter</button>
    <button class="t" id="set" aria-label="Paramètres" title="Paramètres">⚙</button>
    <div id="panel" hidden>
      <div class="f"><label for="lay">Disposition</label>
        <select id="lay"><option>AZERTY</option><option>QWERTY</option><option>QWERTZ</option></select>
      </div>
      <div class="f"><span class="l">Thème de couleur</span><div class="sw" id="sw"></div></div>
      <div class="f" id="devbox"><label for="dev">Appareil Bluetooth (déjà appairé)</label>
        <div class="inl"><select id="dev"></select>
          <button class="t" id="refresh">Actualiser</button>
          <button class="t" id="disc">Rendre visible</button></div>
      </div>
      <div class="chk"><input type="checkbox" id="showout"><label for="showout">Afficher la zone de texte</label></div>
      <div class="f" id="fsbox"><button class="t" id="fs">Plein écran</button></div>
    </div>
  </div>

  <div id="out"></div>
  <div id="kb"></div>
</div>
<script>
const NATIVE = typeof window.Android !== "undefined";
const $ = id => document.getElementById(id);
const SH = 0x02, AG = 0x40; // modificateurs HID : Maj gauche, Alt droit (AltGr)

// ---- Dispositions : [étiquette, code HID de la touche physique] ----
const pos = s => [...s].map(c => c.charCodeAt(0) - 93);   // a=0x04 ... z=0x1D
const zip = (labels, codes) => [...labels].map((l, i) => [l, codes[i]]);
const LAY = {
  AZERTY: [zip("azertyuiop", pos("qwertyuiop")),
           zip("qsdfghjklm", [...pos("asdfghjkl"), 0x33]),
           zip("wxcvbn,;:!", [...pos("zxcvbn"), 0x10, 0x36, 0x37, 0x38])],
  QWERTY: [zip("qwertyuiop", pos("qwertyuiop")),
           zip("asdfghjkl", pos("asdfghjkl")),
           zip("zxcvbnm", pos("zxcvbnm"))],
  QWERTZ: [zip("qwertzuiopü", [...pos("qwertyuiop"), 0x2F]),
           zip("asdfghjklöä", [...pos("asdfghjkl"), 0x33, 0x34]),
           zip("yxcvbnm", pos("zxcvbnm"))]
};
// Symboles : caractère -> [code, modificateurs] selon la disposition de l'ordinateur
const SYM = {
  QWERTY: {"@":[0x1F,SH],"#":[0x20,SH],"_":[0x2D,SH],"&":[0x24,SH],"-":[0x2D,0],"+":[0x2E,SH],"(":[0x26,SH],")":[0x27,SH],"/":[0x38,0],"*":[0x25,SH],'"':[0x34,SH],"'":[0x34,0],":":[0x33,SH],";":[0x33,0],"!":[0x1E,SH],"?":[0x38,SH],"=":[0x2E,0],"%":[0x22,SH],",":[0x36,0],".":[0x37,0]},
  AZERTY: {"@":[0x27,AG],"#":[0x20,AG],"€":[0x08,AG],"_":[0x25,0],"&":[0x1E,0],"-":[0x23,0],"+":[0x2E,SH],"(":[0x22,0],")":[0x2D,0],"/":[0x37,SH],"*":[0x32,0],'"':[0x20,0],"'":[0x21,0],":":[0x37,0],";":[0x36,0],"!":[0x38,0],"?":[0x10,SH],"=":[0x2E,0],"%":[0x34,SH],",":[0x10,0],".":[0x36,SH]},
  QWERTZ: {"@":[0x14,AG],"#":[0x32,0],"€":[0x08,AG],"_":[0x38,SH],"&":[0x23,SH],"-":[0x38,0],"+":[0x30,0],"(":[0x25,SH],")":[0x26,SH],"/":[0x24,SH],"*":[0x30,SH],'"':[0x1F,SH],"'":[0x32,SH],":":[0x37,SH],";":[0x36,SH],"!":[0x1E,SH],"?":[0x2D,SH],"=":[0x27,SH],"%":[0x22,SH],",":[0x36,0],".":[0x37,0]}
};
const SYMROWS = ["@#€_&-+()/", "*\"':;!?=%"];
const THEMES = [["bleu","Bleu","#1457c8","#06265f"],["sombre","Sombre","#2a2a33","#0a0a0c"],["vert","Vert","#17894a","#063a1d"],["rose","Rose","#c2397f","#4a0d2f"],["clair","Clair","#f4f6fb","#cfd5e4"]];

const S = {lay:"AZERTY", thm:"bleu", showOut:!NATIVE, dev:"", shift:false, caps:false, sym:false, bt:false, btName:"", text:""};
try { const v = JSON.parse(localStorage.getItem("clav") || "{}");
  ["lay","thm","dev"].forEach(k => { if (v[k]) S[k] = v[k]; });
  if (typeof v.showOut === "boolean") S.showOut = v.showOut; } catch(e) {}
function save() { try { localStorage.setItem("clav", JSON.stringify({lay:S.lay, thm:S.thm, dev:S.dev, showOut:S.showOut})); } catch(e) {} }

// ---- Envoi d'une touche (vers Android/Bluetooth + aperçu local) ----
function press(code, mods, shown) {
  if (NATIVE) { try { Android.sendKey(code, mods); } catch(e) {} }
  if (shown === "BACK") S.text = S.text.slice(0, -1);
  else if (shown === "ENTER") S.text += "\n";
  else if (shown) S.text += shown;
  $("out").textContent = S.text; $("out").scrollTop = 1e9;
}
function sendSym(ch) {
  const t = SYM[S.lay][ch]; if (!t) return;
  press(t[0], t[1], ch);
}

function mk(label, cls, fn) { const b = document.createElement("button"); b.className = "k " + (cls || ""); b.textContent = label; b.onclick = fn; return b; }
function row() { const r = document.createElement("div"); r.className = "row"; return r; }

function render() {
  document.body.dataset.theme = S.thm;
  $("lay").value = S.lay;
  $("showout").checked = S.showOut; $("out").hidden = !S.showOut;
  document.querySelectorAll("#sw button").forEach(b => b.classList.toggle("sel", b.dataset.t === S.thm));
  const kb = $("kb"); kb.innerHTML = "";
  const up = S.shift || S.caps;
  const shiftIfAzerty = S.lay === "AZERTY" ? SH : 0;

  let r = row();
  "1234567890".split("").forEach((c, i) => r.append(mk(c, "", () => press(0x1E + i, shiftIfAzerty, c))));
  kb.append(r);

  if (S.sym) {
    SYMROWS.forEach((s, i) => {
      r = row();
      [...s].forEach(c => r.append(mk(c, "", () => sendSym(c))));
      if (i === SYMROWS.length - 1) r.append(mk("⌫", "w15 fn", () => press(0x2A, 0, "BACK")));
      kb.append(r);
    });
  } else {
    const rows = LAY[S.lay];
    rows.forEach((keys, i) => {
      r = row();
      const last = i === rows.length - 1;
      if (last) r.append(mk(S.caps ? "⇪" : "⇧", "w15 fn" + (up ? " act" : ""), () => {
        if (S.shift) { S.shift = false; S.caps = true; } else if (S.caps) { S.caps = false; } else S.shift = true; render(); }));
      keys.forEach(([label, code]) => {
        const isLetter = label.toLowerCase() !== label.toUpperCase();
        const ch = (up && isLetter) ? label.toUpperCase() : label;
        r.append(mk(ch, "", () => { press(code, (up && isLetter) ? SH : 0, ch); if (S.shift) { S.shift = false; render(); } }));
      });
      if (last) r.append(mk("⌫", "w15 fn", () => press(0x2A, 0, "BACK")));
      kb.append(r);
    });
  }

  r = row();
  r.append(mk(S.sym ? "ABC" : "123", "w15 fn", () => { S.sym = !S.sym; render(); }));
  r.append(mk(",", "", () => sendSym(",")));
  r.append(mk("espace", "w5", () => press(0x2C, 0, " ")));
  r.append(mk(".", "", () => sendSym(".")));
  r.append(mk("↵", "w15 fn", () => press(0x28, 0, "ENTER")));
  kb.append(r);
}

// ---- Bluetooth ----
function renderBt() {
  $("bt").classList.toggle("on", S.bt);
  $("btx").textContent = S.bt ? "Connecté à : " + (S.btName || "ordinateur") : "Bluetooth : non connecté";
  $("btn").textContent = S.bt ? "Déconnecter" : "Connecter";
}
window.onBtState = (on, name) => { S.bt = !!on; S.btName = name || ""; renderBt(); };
function refreshDevices() {
  const sel = $("dev"); sel.innerHTML = "";
  let list = [];
  if (NATIVE) { try { list = JSON.parse(Android.getDevices()); } catch(e) {} }
  else list = [{name:"Mon ordinateur (simulation)", address:"sim"}];
  if (!list.length) { const o = document.createElement("option"); o.value = ""; o.textContent = "Aucun appareil appairé"; sel.append(o); }
  list.forEach(d => { const o = document.createElement("option"); o.value = d.address; o.textContent = d.name || d.address; sel.append(o); });
  if (list.some(d => d.address === S.dev)) sel.value = S.dev; else S.dev = sel.value;
}
$("btn").onclick = () => {
  if (S.bt) { if (NATIVE) Android.disconnect(); else window.onBtState(false, ""); return; }
  if (!S.dev) { $("panel").hidden = false; return; }
  if (NATIVE) Android.connect(S.dev);
  else window.onBtState(true, $("dev").selectedOptions[0].textContent);
};
$("dev").onchange = e => { S.dev = e.target.value; save(); };
$("refresh").onclick = refreshDevices;
$("disc").onclick = () => { if (NATIVE) Android.discoverable(); else alert("Disponible dans l'application Android."); };

// ---- Paramètres ----
THEMES.forEach(([id, name, c1, c2]) => {
  const b = document.createElement("button"); b.dataset.t = id; b.title = name; b.style.background = `linear-gradient(135deg,${c1},${c2})`;
  b.onclick = () => { S.thm = id; save(); render(); }; $("sw").append(b);
});
$("set").onclick = e => { e.stopPropagation(); $("panel").hidden = !$("panel").hidden; if (!$("panel").hidden) refreshDevices(); };
$("panel").onclick = e => e.stopPropagation();
document.addEventListener("click", () => { $("panel").hidden = true; });
$("lay").onchange = e => { S.lay = e.target.value; S.sym = false; save(); render(); };
$("showout").onchange = e => { S.showOut = e.target.checked; save(); render(); };
if (NATIVE) $("fsbox").hidden = true;
else $("fs").onclick = () => { const d = document; d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen?.(); };
if (!NATIVE) $("disc").hidden = true;

refreshDevices(); renderBt(); render();
</script>
</body>
</html>
